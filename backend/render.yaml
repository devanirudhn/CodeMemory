services:
  - type: web
    name: codememory-api
    runtime: node
    rootDir: codememory/backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: codememory-review-history
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8080
      - key: CODEMEMORY_TEAM_ID
        value: demo-team
      - key: CODEMEMORY_DATA_DIR
        value: .data
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: HINDSIGHT_API_URL
        sync: false
      - key: HINDSIGHT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
